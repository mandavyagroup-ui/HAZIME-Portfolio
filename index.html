<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Hazime Nepal Butwal · Portfolio</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #f0f4f8;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: #0f172a;
      line-height: 1.5;
    }
    .app { max-width: 1500px; margin: 0 auto; padding: 1.5rem 2rem; }

    .header {
      background: white; border-radius: 2rem; padding: 1.3rem 2rem;
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      box-shadow: 0 12px 30px -10px rgba(0,0,0,0.05); margin-bottom: 2rem; gap: 1rem;
    }
    .brand { display: flex; align-items: center; gap: 0.8rem; }
    .brand-logo {
      background: #0b2b4f; color: white; width: 48px; height: 48px;
      border-radius: 16px; display: flex; align-items: center; justify-content: center;
      font-size: 1.6rem; flex-shrink: 0;
    }
    .brand h1 { font-size: 1.7rem; font-weight: 700; color: #0b1e33; line-height: 1.2; }
    .brand span { font-size: 0.85rem; color: #5f6b7a; display: block; }
    .header-actions { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; }

    .btn {
      padding: 0.65rem 1.4rem; border-radius: 2.5rem; font-weight: 600; font-size: 0.85rem;
      border: 1px solid #dce3ec; background: white; cursor: pointer;
      display: inline-flex; align-items: center; gap: 0.5rem; transition: all 0.2s;
      white-space: nowrap; line-height: 1;
    }
    .btn i { font-size: 0.9rem; display: inline-flex; align-items: center; justify-content: center; }
    .btn-primary { background: #0b2b4f; color: white; border-color: #0b2b4f; }
    .btn-primary:hover { background: #123d63; }
    .btn-outline:hover { background: #f1f5ff; border-color: #0b2b4f; }
    .btn-success { background: #10b981; color: white; border-color: #10b981; }
    .btn-success:hover { background: #059669; }

    .tabs { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.8rem; }
    .tab {
      padding: 0.7rem 1.7rem; border-radius: 2.5rem; font-weight: 600; font-size: 0.9rem;
      background: white; border: 1px solid #e2e8f0; cursor: pointer; transition: 0.2s;
      color: #475569; display: flex; align-items: center; gap: 0.5rem;
    }
    .tab i { font-size: 0.9rem; display: inline-flex; align-items: center; }
    .tab.active { background: #0b2b4f; color: white; border-color: #0b2b4f; }
    .tab .count {
      background: rgba(0,0,0,0.08); padding: 0.15rem 0.55rem;
      border-radius: 1rem; font-size: 0.7rem; font-weight: 600;
    }
    .tab.active .count { background: rgba(255,255,255,0.25); }

    .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.7rem; }
    .card {
      background: white; border-radius: 1.8rem; overflow: hidden;
      box-shadow: 0 15px 28px -10px rgba(0,0,0,0.07); transition: 0.25s;
      border: 1px solid #eef2f8; display: flex; flex-direction: column;
    }
    .card:hover { transform: translateY(-3px); box-shadow: 0 22px 34px -12px rgba(0,20,40,0.14); }

    .media-frame {
      width: 100%; aspect-ratio: 16/9; background: #edf2f9;
      display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative;
    }
    .media-frame img, .media-frame video { width: 100%; height: 100%; object-fit: cover; }
    .media-frame iframe { width: 100%; height: 100%; border: 0; }

    .design-preview {
      background: linear-gradient(135deg, #eef2ff, #f9fafc);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 0.8rem; width: 100%; height: 100%; padding: 1rem;
    }
    .design-preview i { font-size: 2.8rem; color: #0b2b4f; }
    .design-preview a { color: #0b2b4f; font-weight: 600; text-decoration: underline; font-size: 0.9rem; }

    .card-body {
      padding: 1rem 1.2rem; display: flex; justify-content: space-between;
      align-items: center; flex-wrap: wrap; gap: 0.7rem;
    }
    .card-info { flex: 1; min-width: 0; }
    .item-name {
      font-weight: 650; font-size: 0.95rem;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .item-meta { display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; margin-top: 0.2rem; }
    .platform-badge {
      background: #e9eff9; color: #0b2b4f; font-size: 0.68rem;
      padding: 0.2rem 0.6rem; border-radius: 1rem; font-weight: 600;
    }
    .category-tag { font-size: 0.7rem; color: #64748b; }
    .card-actions { display: flex; gap: 0.3rem; flex-shrink: 0; }
    .icon-btn {
      background: #f8fafc; border: 1px solid #dce3ec; border-radius: 2rem;
      padding: 0.4rem 0.7rem; cursor: pointer; font-size: 0.8rem;
      display: flex; align-items: center; gap: 0.3rem; transition: 0.2s; color: #334155;
    }
    .icon-btn:hover { background: #eef2ff; }
    .icon-btn.download-btn { background: #0b2b4f; color: white; border-color: #0b2b4f; }
    .icon-btn.download-btn:hover { background: #123d63; }
    .icon-btn.delete-btn:hover { background: #fef2f2; color: #b91c1c; }

    .empty-state { text-align: center; padding: 3rem; color: #64748b; grid-column: 1/-1; }
    .empty-state i { font-size: 2.5rem; opacity: 0.5; margin-bottom: 0.8rem; display: block; }

    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
      display: none; align-items: center; justify-content: center; z-index: 1000;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: white; border-radius: 2rem; padding: 2rem; width: 90%;
      max-width: 580px; box-shadow: 0 30px 45px rgba(0,0,0,0.2); max-height: 90vh; overflow-y: auto;
    }
    .modal h3 { margin-bottom: 1.5rem; font-size: 1.2rem; display: flex; align-items: center; gap: 0.5rem; }
    .form-group { margin-bottom: 1.2rem; display: flex; flex-direction: column; gap: 0.4rem; }
    .form-group label {
      font-weight: 600; font-size: 0.8rem; color: #475569;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .form-group input, .form-group select {
      padding: 0.75rem 1rem; border-radius: 2rem; border: 1px solid #dce3ec;
      background: #fafbfc; font-size: 0.9rem;
    }
    .form-group input:focus, .form-group select:focus { outline: 2px solid #0b2b4f; outline-offset: 2px; }

    .upload-area {
      border: 2px dashed #dce3ec; border-radius: 1.5rem; padding: 2rem;
      text-align: center; cursor: pointer; transition: 0.3s; background: #fafbfc;
    }
    .upload-area:hover { border-color: #0b2b4f; background: #f1f5ff; }
    .upload-area i { font-size: 2rem; color: #0b2b4f; margin-bottom: 0.5rem; }

    .preview-container {
      width: 100%; aspect-ratio: 16/9; background: #edf2f9;
      border-radius: 1rem; overflow: hidden; margin-top: 0.5rem; display: none; position: relative;
    }
    .preview-container.active { display: block; }
    .preview-container img, .preview-container video, .preview-container iframe {
      width: 100%; height: 100%; object-fit: cover; border: 0;
    }
    .modal-actions { display: flex; gap: 0.8rem; justify-content: flex-end; margin-top: 1.8rem; flex-wrap: wrap; }
    .drive-hint { font-size: 0.75rem; color: #64748b; margin-top: 0.3rem; display: flex; align-items: center; gap: 0.3rem; }

    .status-message {
      position: fixed; bottom: 20px; right: 20px; padding: 1rem 1.5rem;
      border-radius: 2rem; color: white; font-weight: 600; z-index: 3000;
      display: none; animation: slideIn 0.3s ease;
    }
    @keyframes slideIn { from { transform: translateX(100px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    .status-success { background: #10b981; display: block; }
    .status-error { background: #ef4444; display: block; }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <div class="brand-logo"><i class="fas fa-mountain"></i></div>
        <div>
          <h1>Hazime Nepal</h1>
          <span>Butwal · media portfolio</span>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn btn-outline" id="manageCategoriesBtn">
          <i class="fas fa-folder-tree"></i> Categories
        </button>
        <button class="btn btn-primary" id="openImportModalBtn">
          <i class="fas fa-plus-circle"></i> Add Media
        </button>
        <button class="btn btn-outline" id="refreshBtn" title="Refresh from cloud">
          <i class="fas fa-sync-alt"></i>
        </button>
      </div>
    </header>

    <div class="tabs">
      <div class="tab active" data-tab="photos">
        <i class="fas fa-camera-retro"></i> Photos <span class="count" id="photosCount">0</span>
      </div>
      <div class="tab" data-tab="videos">
        <i class="fas fa-video"></i> Videos <span class="count" id="videosCount">0</span>
      </div>
      <div class="tab" data-tab="designs">
        <i class="fas fa-palette"></i> Designs/Links <span class="count" id="designsCount">0</span>
      </div>
      <div class="tab" data-tab="other">
        <i class="fas fa-file-alt"></i> Other Files <span class="count" id="otherCount">0</span>
      </div>
    </div>

    <div class="gallery-grid" id="galleryContainer"></div>
  </div>

  <div class="status-message" id="statusMessage"></div>

  <!-- Add Media Modal -->
  <div class="modal-overlay" id="importModal">
    <div class="modal">
      <h3><i class="fas fa-plus-circle"></i> Add Media</h3>

      <div class="form-group">
        <label>Upload from Device</label>
        <div class="upload-area" id="uploadArea">
          <i class="fas fa-cloud-upload-alt"></i>
          <p>Click or drag file here</p>
          <small>Photos, videos, or documents</small>
        </div>
        <input type="file" id="fileInput" style="display:none;" accept="image/*,video/*,.pdf,.zip,.psd,.ai">
      </div>

      <div style="text-align:center; margin:1rem 0; color:#94a3b8;">— OR —</div>

      <div class="form-group">
        <label>Paste Link (Google Drive / YouTube / etc.)</label>
        <input type="text" id="importUrl" placeholder="https://drive.google.com/file/d/...">
        <div class="drive-hint">
          <i class="fas fa-info-circle"></i> Best for multi-device: Upload to Drive, paste share link
        </div>
      </div>

      <div class="form-group">
        <label>Section</label>
        <select id="importSection">
          <option value="photos">📷 Photos</option>
          <option value="videos">🎬 Videos</option>
          <option value="designs">🎨 Designs / Links</option>
          <option value="other">📄 Other Files</option>
        </select>
      </div>

      <div class="form-group">
        <label>Item Name</label>
        <input type="text" id="detailName" placeholder="e.g., Butwal Sunset">
      </div>

      <div class="form-group">
        <label>Category</label>
        <input type="text" id="detailCategory" placeholder="e.g., Nature, Events (or choose existing)">
        <select id="detailCategorySelect" style="margin-top:0.3rem;">
          <option value="">-- Existing categories --</option>
        </select>
      </div>

      <div class="form-group">
        <label>Platform</label>
        <select id="detailPlatform">
          <option value="Google Drive">Google Drive</option>
          <option value="Device Upload">Device Upload</option>
          <option value="YouTube">YouTube</option>
          <option value="Vimeo">Vimeo</option>
          <option value="Direct Link">Direct Link</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="preview-container" id="importPreviewContainer">
        <img id="importPreviewImage" alt="Preview" style="display:none;">
        <video id="importPreviewVideo" controls style="display:none;"></video>
        <iframe id="importPreviewIframe" style="display:none;" allow="autoplay; fullscreen" allowfullscreen></iframe>
      </div>

      <div class="modal-actions">
        <button class="btn btn-outline" id="cancelImportBtn">Cancel</button>
        <button class="btn btn-primary" id="saveMediaBtn">
          <i class="fas fa-save"></i> Save Media
        </button>
      </div>
    </div>
  </div>

  <!-- Category Management Modal -->
  <div class="modal-overlay" id="categoryModal">
    <div class="modal">
      <h3><i class="fas fa-folder-tree"></i> Manage Categories</h3>
      <div class="form-group">
        <label>Add new category</label>
        <div style="display:flex; gap:0.5rem;">
          <input type="text" id="newCategoryInput" placeholder="e.g., Events, Portraits" style="flex:1;">
          <button class="btn btn-primary" id="addCategoryBtn">Add</button>
        </div>
      </div>
      <div style="margin:1rem 0;">
        <strong>Existing categories:</strong>
        <ul id="categoryList" style="list-style:none; margin-top:0.5rem; max-height:200px; overflow-y:auto;"></ul>
      </div>
      <div class="modal-actions">
        <button class="btn btn-outline" id="closeCategoryModalBtn">Done</button>
      </div>
    </div>
  </div>

  <script>
    (function() {
      // ============================================
      // YOUR GOOGLE SHEETS URLs
      // ============================================
      const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT5PiOx2fH1UxOivvGIlo12k0j4MVNWUp47ZL0KEtc1oJ3M8WObdBoHcbbcmKXJ4bZnH04HghDNx7wQ/pub?output=csv';
      const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwTCQLCTWLNRplbwzQJyTakLjxG5gpKTGv_-pRubMFsHD7mrk3N44n9FiQy4t6GDar7/exec';

      const STORAGE_KEY = 'hazime_local_backup';
      let data = { categories: [], items: [] };
      let uploadedFiles = {};
      let currentTab = 'photos';
      let pendingFile = null;

      function showStatus(msg, type) {
        const el = document.getElementById('statusMessage');
        el.textContent = msg;
        el.className = 'status-message status-' + type;
        setTimeout(() => { el.className = 'status-message'; }, 3000);
      }

      // Load from Google Sheets
      async function loadFromSheets() {
        try {
          const res = await fetch(SHEET_CSV_URL);
          if (!res.ok) throw new Error('Sheet fetch failed');
          const csv = await res.text();
          const rows = csv.split('\n').slice(1);
          
          data.items = rows.filter(r => r.trim()).map(r => {
            const c = r.split(',');
            return {
              id: c[0]?.trim(),
              section: c[1]?.trim(),
              name: c[2]?.trim(),
              url: c[3]?.trim(),
              downloadUrl: c[4]?.trim() || c[3]?.trim(),
              embedUrl: c[5]?.trim() || '',
              thumbnail: c[6]?.trim() || '',
              platform: c[7]?.trim() || 'Google Drive',
              category: c[8]?.trim() || '',
              description: c[9]?.trim() || ''
            };
          });

          const cats = [...new Set(data.items.map(i => i.category).filter(Boolean))];
          data.categories = cats;
          
          // Backup locally
          localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
          return true;
        } catch (e) {
          console.warn('Sheets load failed, using local backup:', e.message);
          return false;
        }
      }

      function loadLocalBackup() {
        const s = localStorage.getItem(STORAGE_KEY);
        if (s) data = JSON.parse(s);
      }

      // Save to Sheets
      async function saveToSheets(item) {
        try {
          const res = await fetch(APPS_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify(item)
          });
          return true;
        } catch (e) {
          console.warn('Sheets save failed:', e.message);
          return false;
        }
      }

      function saveLocally() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      }

      function detectSection(url) {
        const l = url.toLowerCase();
        if (l.includes('youtube') || l.includes('youtu.be') || l.includes('vimeo') || l.match(/\.(mp4|webm|mov)/)) return 'videos';
        if (l.match(/\.(jpg|jpeg|png|gif|webp|svg)/) || l.includes('uc?export=view')) return 'photos';
        if (l.includes('figma') || l.includes('canva') || l.includes('behance')) return 'designs';
        return 'other';
      }

      function convertDriveLink(url) {
        const m = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
        if (m) {
          const id = m[1];
          return {
            view: `https://drive.google.com/uc?export=view&id=${id}`,
            download: `https://drive.google.com/uc?export=download&id=${id}`,
            embed: `https://drive.google.com/file/d/${id}/preview`,
            thumb: `https://drive.google.com/thumbnail?id=${id}&sz=w600`
          };
        }
        return null;
      }

      function convertYoutube(url) {
        const m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|embed\/)([a-zA-Z0-9_-]+)/);
        return m ? { embed: `https://www.youtube.com/embed/${m[1]}` } : null;
      }

      function getItems(section) {
        return data.items.filter(i => i.section === section);
      }

      function updateCounts() {
        ['photos','videos','designs','other'].forEach(s => {
          document.getElementById(s+'Count').textContent = getItems(s).length;
        });
      }

      function renderGallery() {
        const items = getItems(currentTab);
        updateCounts();
        const g = document.getElementById('galleryContainer');

        if (!items.length) {
          g.innerHTML = `<div class="empty-state"><i class="fas fa-folder-open"></i><p>No items yet. Click "Add Media" to start!</p></div>`;
          return;
        }

        g.innerHTML = items.map(item => {
          let html = '';
          if (item.section === 'photos') {
            html = `<img src="${item.thumbnail || item.url}" alt="${item.name}" loading="lazy" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22400%22 height=%22300%22><rect fill=%22%23e2e8f0%22 width=%22400%22 height=%22300%22/><text x=%22150%22 y=%22160%22 fill=%22%2394a3b8%22>Image</text></svg>';">`;
          } else if (item.section === 'videos') {
            html = item.embedUrl 
              ? `<iframe src="${item.embedUrl}" allow="autoplay; fullscreen" allowfullscreen></iframe>`
              : `<video controls src="${item.url}"></video>`;
          } else {
            html = `<div class="design-preview"><i class="fas fa-${item.section==='designs'?'palette':'file'}"></i><a href="${item.url}" target="_blank">Open ${item.section==='designs'?'Design':'File'}</a></div>`;
          }

          return `<div class="card">
            <div class="media-frame">${html}</div>
            <div class="card-body">
              <div class="card-info">
                <div class="item-name">${item.name||'Untitled'}</div>
                <div class="item-meta">
                  <span class="platform-badge">${item.platform||'Drive'}</span>
                  ${item.category?`<span class="category-tag">📁 ${item.category}</span>`:''}
                </div>
              </div>
              <div class="card-actions">
                <button class="icon-btn copy-btn" data-url="${item.downloadUrl||item.url}"><i class="fas fa-copy"></i></button>
                <button class="icon-btn download-btn" data-url="${item.downloadUrl||item.url}" data-name="${item.name}"><i class="fas fa-download"></i> DL</button>
                <button class="icon-btn delete-btn" data-id="${item.id}"><i class="fas fa-trash"></i></button>
              </div>
            </div>
          </div>`;
        }).join('');

        // Events
        g.querySelectorAll('.copy-btn').forEach(b => b.onclick = () => {
          navigator.clipboard.writeText(b.dataset.url).then(() => showStatus('📋 Link copied!','success'));
        });
        g.querySelectorAll('.download-btn').forEach(b => b.onclick = () => {
          window.open(b.dataset.url, '_blank');
        });
        g.querySelectorAll('.delete-btn').forEach(b => b.onclick = async () => {
          if (confirm('Delete this item?')) {
            data.items = data.items.filter(i => i.id !== b.dataset.id);
            saveLocally();
            renderGallery();
            showStatus('🗑️ Deleted','success');
          }
        });
      }

      function populateCategories() {
        const sel = document.getElementById('detailCategorySelect');
        sel.innerHTML = '<option value="">-- Existing --</option>';
        data.categories.forEach(c => sel.innerHTML += `<option>${c}</option>`);
      }

      async function saveMedia() {
        const name = document.getElementById('detailName').value.trim();
        if (!name) { showStatus('Please enter a name','error'); return; }

        let cat = document.getElementById('detailCategory').value.trim();
        const catSel = document.getElementById('detailCategorySelect').value;
        if (!cat && catSel) cat = catSel;
        if (cat && !data.categories.includes(cat)) {
          data.categories.push(cat);
        }

        const section = document.getElementById('importSection').value;
        const platform = document.getElementById('detailPlatform').value;
        const id = Date.now().toString(36) + Math.random().toString(36).substr(2,6);

        let url, downloadUrl, embedUrl, thumbnail;
        
        if (pendingFile) {
          url = pendingFile;
          downloadUrl = pendingFile;
          thumbnail = pendingFile;
          embedUrl = '';
        } else {
          const rawUrl = document.getElementById('importUrl').value.trim();
          const drive = convertDriveLink(rawUrl);
          const yt = convertYoutube(rawUrl);
          
          if (drive) {
            url = drive.view;
            downloadUrl = drive.download;
            embedUrl = drive.embed;
            thumbnail = drive.thumb;
          } else if (yt) {
            url = rawUrl;
            downloadUrl = rawUrl;
            embedUrl = yt.embed;
            thumbnail = '';
          } else {
            url = rawUrl;
            downloadUrl = rawUrl;
            embedUrl = '';
            thumbnail = rawUrl;
          }
        }

        const item = { id, section, name, url, downloadUrl, embedUrl, thumbnail, platform, category: cat, description: '' };

        // Save locally immediately
        data.items.push(item);
        saveLocally();
        
        // Try saving to sheets
        const sheetOk = await saveToSheets(item);
        
        // Close modal
        document.getElementById('importModal').classList.remove('active');
        document.getElementById('importUrl').value = '';
        document.getElementById('detailName').value = '';
        document.getElementById('detailCategory').value = '';
        document.getElementById('fileInput').value = '';
        pendingFile = null;
        
        currentTab = section;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelector(`[data-tab="${section}"]`).classList.add('active');
        
        renderGallery();
        showStatus(sheetOk ? '☁️ Saved to cloud! Visible on all devices.' : '💾 Saved locally. Will sync when online.','success');
      }

      // Initial load
      async function init() {
        const sheetLoaded = await loadFromSheets();
        if (!sheetLoaded) loadLocalBackup();
        
        populateCategories();
        renderGallery();
        updateCounts();
        
        if (sheetLoaded) showStatus('☁️ Connected! Data syncs across devices.','success');
      }

      // Event Listeners
      document.getElementById('openImportModalBtn').onclick = () => {
        document.getElementById('importModal').classList.add('active');
        document.getElementById('importSection').value = currentTab;
        document.getElementById('detailPlatform').value = 'Google Drive';
        populateCategories();
      };

      document.getElementById('cancelImportBtn').onclick = () => {
        document.getElementById('importModal').classList.remove('active');
        pendingFile = null;
      };

      document.getElementById('saveMediaBtn').onclick = saveMedia;

      document.getElementById('refreshBtn').onclick = async () => {
        await loadFromSheets();
        populateCategories();
        renderGallery();
        showStatus('🔄 Refreshed from cloud!','success');
      };

      // File upload
      const uploadArea = document.getElementById('uploadArea');
      const fileInput = document.getElementById('fileInput');
      uploadArea.onclick = () => fileInput.click();
      uploadArea.ondragover = e => { e.preventDefault(); uploadArea.style.borderColor = '#0b2b4f'; };
      uploadArea.ondragleave = () => { uploadArea.style.borderColor = '#dce3ec'; };
      uploadArea.ondrop = e => {
        e.preventDefault();
        uploadArea.style.borderColor = '#dce3ec';
        if (e.dataTransfer.files.length) readFile(e.dataTransfer.files[0]);
      };
      fileInput.onchange = e => { if (e.target.files.length) readFile(e.target.files[0]); };

      function readFile(file) {
        const reader = new FileReader();
        reader.onload = ev => {
          pendingFile = ev.target.result;
          document.getElementById('importUrl').value = '📁 ' + file.name;
          document.getElementById('detailName').value = file.name.replace(/\.[^/.]+$/, '');
          document.getElementById('detailPlatform').value = 'Device Upload';
          
          if (file.type.startsWith('image/')) document.getElementById('importSection').value = 'photos';
          else if (file.type.startsWith('video/')) document.getElementById('importSection').value = 'videos';
          else document.getElementById('importSection').value = 'other';
        };
        reader.readAsDataURL(file);
      }

      // Category modal
      document.getElementById('manageCategoriesBtn').onclick = () => {
        const list = document.getElementById('categoryList');
        list.innerHTML = data.categories.map(c =>
          `<li style="display:flex;justify-content:space-between;padding:0.4rem 0;border-bottom:1px solid #eee;">
            <span>📁 ${c}</span>
            <button class="icon-btn delete-btn" data-cat="${c}"><i class="fas fa-trash"></i></button>
          </li>`
        ).join('') || '<li>No categories</li>';
        
        list.querySelectorAll('.delete-btn').forEach(b => b.onclick = () => {
          if (confirm('Delete category?')) {
            data.categories = data.categories.filter(c => c !== b.dataset.cat);
            saveLocally();
            document.getElementById('manageCategoriesBtn').click();
            populateCategories();
          }
        });
        
        document.getElementById('categoryModal').classList.add('active');
      };

      document.getElementById('closeCategoryModalBtn').onclick = () => {
        document.getElementById('categoryModal').classList.remove('active');
      };

      document.getElementById('addCategoryBtn').onclick = () => {
        const val = document.getElementById('newCategoryInput').value.trim();
        if (!val) return;
        if (data.categories.includes(val)) { showStatus('Already exists','error'); return; }
        data.categories.push(val);
        saveLocally();
        document.getElementById('newCategoryInput').value = '';
        document.getElementById('manageCategoriesBtn').click();
        populateCategories();
        showStatus('✅ Category added!','success');
      };

      // Tab switching
      document.querySelectorAll('.tab').forEach(t => {
        t.onclick = () => {
          document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
          t.classList.add('active');
          currentTab = t.dataset.tab;
          renderGallery();
        };
      });

      // Close modals on overlay click
      document.querySelectorAll('.modal-overlay').forEach(m => {
        m.onclick = e => { if (e.target === m) m.classList.remove('active'); };
      });

      // Start
      init();
      console.log('✅ Hazime Nepal Butwal - Ready');
      console.log('📊 Sheets:', SHEET_CSV_URL ? 'Configured' : 'Not set');
      console.log('🔌 API:', APPS_SCRIPT_URL ? 'Configured' : 'Not set');
    })();
  </script>
</body>
</html>
