<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Hazime Nepal Butwal · Portfolio</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #f0f4f8;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: #0f172a;
      line-height: 1.5;
    }
    .app { max-width: 1500px; margin: 0 auto; padding: 1.5rem 2rem; }

    .header {
      background: white; border-radius: 2rem; padding: 1.3rem 2rem;
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      box-shadow: 0 12px 30px -10px rgba(0,0,0,0.05); margin-bottom: 2rem; gap: 1rem;
    }
    .brand { display: flex; align-items: center; gap: 0.8rem; }
    .brand-logo {
      background: #0b2b4f; color: white; width: 48px; height: 48px;
      border-radius: 16px; display: flex; align-items: center; justify-content: center;
      font-size: 1.6rem; flex-shrink: 0;
    }
    .brand h1 { font-size: 1.7rem; font-weight: 700; color: #0b1e33; }
    .brand span { font-size: 0.85rem; color: #5f6b7a; display: block; }
    .header-actions { display: flex; gap: 0.6rem; flex-wrap: wrap; }

    .btn {
      padding: 0.65rem 1.4rem; border-radius: 2.5rem; font-weight: 600; font-size: 0.85rem;
      border: 1px solid #dce3ec; background: white; cursor: pointer;
      display: inline-flex; align-items: center; gap: 0.5rem; transition: all 0.2s;
    }
    .btn-primary { background: #0b2b4f; color: white; border-color: #0b2b4f; }
    .btn-primary:hover { background: #123d63; }
    .btn-outline:hover { background: #f1f5ff; border-color: #0b2b4f; }
    .btn-success { background: #10b981; color: white; border-color: #10b981; }
    .btn-success:hover { background: #059669; }

    .tabs { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.8rem; }
    .tab {
      padding: 0.7rem 1.7rem; border-radius: 2.5rem; font-weight: 600; font-size: 0.9rem;
      background: white; border: 1px solid #e2e8f0; cursor: pointer; transition: 0.2s;
      color: #475569; display: flex; align-items: center; gap: 0.5rem;
    }
    .tab.active { background: #0b2b4f; color: white; border-color: #0b2b4f; }
    .tab .count { background: rgba(0,0,0,0.08); padding: 0.15rem 0.55rem; border-radius: 1rem; font-size: 0.7rem; }
    .tab.active .count { background: rgba(255,255,255,0.25); }

    .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.7rem; }
    .card {
      background: white; border-radius: 1.8rem; overflow: hidden;
      box-shadow: 0 15px 28px -10px rgba(0,0,0,0.07); transition: 0.25s;
      border: 1px solid #eef2f8;
    }
    .card:hover { transform: translateY(-3px); box-shadow: 0 22px 34px -12px rgba(0,20,40,0.14); }

    .media-frame {
      width: 100%; aspect-ratio: 16/9; background: #edf2f9;
      display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    .media-frame img, .media-frame video { width: 100%; height: 100%; object-fit: cover; }
    .media-frame iframe { width: 100%; height: 100%; border: 0; }

    .design-preview {
      background: linear-gradient(135deg, #eef2ff, #f9fafc);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 0.5rem; width: 100%; height: 100%;
    }
    .design-preview i { font-size: 2.5rem; color: #0b2b4f; }
    .design-preview a { color: #0b2b4f; font-weight: 600; }

    .card-body {
      padding: 1rem 1.2rem; display: flex; justify-content: space-between;
      align-items: center; flex-wrap: wrap; gap: 0.5rem;
    }
    .card-info { flex: 1; min-width: 0; }
    .item-name { font-weight: 650; font-size: 0.95rem; }
    .item-meta { display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; margin-top: 0.2rem; }
    .platform-badge {
      background: #e9eff9; color: #0b2b4f; font-size: 0.68rem;
      padding: 0.2rem 0.6rem; border-radius: 1rem; font-weight: 600;
    }
    .category-tag { font-size: 0.7rem; color: #64748b; }
    .card-actions { display: flex; gap: 0.3rem; }
    .icon-btn {
      background: #f8fafc; border: 1px solid #dce3ec; border-radius: 2rem;
      padding: 0.4rem 0.7rem; cursor: pointer; font-size: 0.8rem;
      display: flex; align-items: center; gap: 0.3rem; transition: 0.2s; color: #334155;
    }
    .icon-btn:hover { background: #eef2ff; }
    .icon-btn.dl-btn { background: #0b2b4f; color: white; border-color: #0b2b4f; }
    .icon-btn.dl-btn:hover { background: #123d63; }

    .empty-state { text-align: center; padding: 3rem; color: #64748b; grid-column: 1/-1; }
    .empty-state i { font-size: 2.5rem; opacity: 0.5; margin-bottom: 0.8rem; display: block; }

    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
      z-index: 1000; display: none; align-items: center; justify-content: center;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: white; border-radius: 2rem; padding: 2rem; width: 90%;
      max-width: 580px; max-height: 90vh; overflow-y: auto; box-shadow: 0 30px 45px rgba(0,0,0,0.2);
    }
    .modal h3 { margin-bottom: 1.5rem; font-size: 1.2rem; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { font-weight: 600; font-size: 0.8rem; color: #475569; display: block; margin-bottom: 0.3rem; }
    .form-group input, .form-group select {
      width: 100%; padding: 0.75rem 1rem; border-radius: 2rem; border: 1px solid #dce3ec;
      background: #fafbfc; font-size: 0.9rem;
    }

    .upload-box {
      border: 2px dashed #dce3ec; border-radius: 1.5rem; min-height: 180px;
      cursor: pointer; transition: 0.3s; background: #fafbfc; position: relative; overflow: hidden;
    }
    .upload-box:hover { border-color: #0b2b4f; }
    .upload-box.filled { border-style: solid; border-color: #0b2b4f; }
    .upload-placeholder {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 2rem; height: 100%; min-height: 180px;
    }
    .upload-box.filled .upload-placeholder { display: none; }
    .upload-placeholder i { font-size: 2.5rem; color: #0b2b4f; margin-bottom: 0.5rem; }
    .upload-preview {
      display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    }
    .upload-box.filled .upload-preview { display: block; }
    .upload-preview img, .upload-preview video { width: 100%; height: 100%; object-fit: cover; }
    .upload-preview iframe { width: 100%; height: 100%; border: 0; }
    .change-btn {
      position: absolute; top: 8px; right: 8px; z-index: 5;
      background: rgba(0,0,0,0.7); color: white; border: none;
      padding: 0.3rem 0.7rem; border-radius: 1rem; font-size: 0.7rem; cursor: pointer;
      display: none;
    }
    .upload-box.filled .change-btn { display: block; }

    .divider { text-align: center; margin: 1rem 0; color: #94a3b8; font-size: 0.85rem; }
    .modal-actions { display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1.5rem; }

    .toast {
      position: fixed; bottom: 20px; right: 20px; padding: 1rem 1.5rem;
      border-radius: 2rem; color: white; font-weight: 600; z-index: 3000;
      animation: slideIn 0.3s;
    }
    @keyframes slideIn { from { transform: translateX(100px); opacity: 0; } }
    .toast-ok { background: #10b981; }
    .toast-err { background: #ef4444; }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <div class="brand-logo"><i class="fas fa-mountain"></i></div>
        <div><h1>Hazime Nepal</h1><span>Butwal · media portfolio</span></div>
      </div>
      <div class="header-actions">
        <button class="btn btn-outline" id="refreshBtn"><i class="fas fa-sync-alt"></i> Sync</button>
        <button class="btn btn-primary" id="addBtn"><i class="fas fa-plus-circle"></i> Add Media</button>
      </div>
    </header>

    <div class="tabs" id="tabsContainer">
      <div class="tab active" data-tab="photos"><i class="fas fa-camera-retro"></i> Photos <span class="count">0</span></div>
      <div class="tab" data-tab="videos"><i class="fas fa-video"></i> Videos <span class="count">0</span></div>
      <div class="tab" data-tab="designs"><i class="fas fa-palette"></i> Designs/Links <span class="count">0</span></div>
      <div class="tab" data-tab="other"><i class="fas fa-file-alt"></i> Other <span class="count">0</span></div>
    </div>

    <div class="gallery-grid" id="gallery"></div>
  </div>

  <!-- MODAL -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <h3><i class="fas fa-plus-circle"></i> Add Media</h3>

      <div class="upload-box" id="uploadBox">
        <div class="upload-placeholder">
          <i class="fas fa-cloud-upload-alt"></i>
          <p><strong>Click or drag file</strong></p>
          <small>or paste link below</small>
          <p id="fileNameDisplay" style="color:#0b2b4f;font-weight:600;margin-top:0.3rem;"></p>
        </div>
        <div class="upload-preview">
          <img id="prevImg" style="display:none;">
          <video id="prevVid" controls style="display:none;"></video>
          <iframe id="prevIframe" style="display:none;" allowfullscreen></iframe>
        </div>
        <button class="change-btn" id="changeBtn">✕ Remove</button>
      </div>
      <input type="file" id="fileInput" hidden accept="image/*,video/*">

      <div class="divider">— OR paste link —</div>

      <div class="form-group">
        <label>Media Link</label>
        <input type="text" id="linkInput" placeholder="https://drive.google.com/file/d/...">
      </div>
      <div class="form-group">
        <label>Name *</label>
        <input type="text" id="nameInput" placeholder="Item name">
      </div>
      <div class="form-group">
        <label>Section</label>
        <select id="sectionSelect">
          <option value="photos">📷 Photos</option>
          <option value="videos">🎬 Videos</option>
          <option value="designs">🎨 Designs</option>
          <option value="other">📄 Other</option>
        </select>
      </div>
      <div class="form-group">
        <label>Category</label>
        <input type="text" id="catInput" placeholder="e.g., Nature">
      </div>
      <div class="modal-actions">
        <button class="btn btn-outline" id="cancelBtn">Cancel</button>
        <button class="btn btn-success" id="saveBtn"><i class="fas fa-check"></i> Save</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" style="display:none;"></div>

  <script>
    (() => {
      // CONFIG
      const SHEET_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT5PiOx2fH1UxOivvGIlo12k0j4MVNWUp47ZL0KEtc1oJ3M8WObdBoHcbbcmKXJ4bZnH04HghDNx7wQ/pub?output=csv';
      const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwTCQLCTWLNRplbwzQJyTakLjxG5gpKTGv_-pRubMFsHD7mrk3N44n9FiQy4t6GDar7/exec';
      const LK = 'hzb_data';

      let items = [], tab = 'photos', fileData = null, fileType = null;

      // Toast
      const toast = (m, ok = true) => {
        const t = document.getElementById('toast');
        t.textContent = m; t.className = 'toast ' + (ok ? 'toast-ok' : 'toast-err');
        t.style.display = 'block';
        clearTimeout(t._t); t._t = setTimeout(() => t.style.display = 'none', 2500);
      };

      // DOM refs
      const $ = id => document.getElementById(id);
      const gallery = $('gallery'), modal = $('modal'), uploadBox = $('uploadBox');
      const prevImg = $('prevImg'), prevVid = $('prevVid'), prevIframe = $('prevIframe');

      // ========== STORAGE ==========
      function loadLocal() {
        const d = localStorage.getItem(LK);
        if (d) items = JSON.parse(d);
      }
      function saveLocal() { localStorage.setItem(LK, JSON.stringify(items)); }

      // ========== SHEETS API (FIXED) ==========
      async function fetchSheet() {
        try {
          const r = await fetch(SHEET_CSV);
          if (!r.ok) return [];
          const t = await r.text();
          return t.split('\n').slice(1).filter(l => l.trim()).map(l => {
            const c = l.split(',');
            return {
              id: c[0]?.trim() || '', section: c[1]?.trim() || 'photos',
              name: c[2]?.trim() || '', url: c[3]?.trim() || '',
              dl: c[4]?.trim() || c[3]?.trim() || '', embed: c[5]?.trim() || '',
              thumb: c[6]?.trim() || '', platform: c[7]?.trim() || '',
              cat: c[8]?.trim() || '', desc: c[9]?.trim() || ''
            };
          });
        } catch { return []; }
      }

      // Save via GET (bypasses CORS) - Google Apps Script compatible
      function saveToSheet(item) {
        const params = new URLSearchParams({
          id: item.id, section: item.section, name: item.name,
          url: item.url, dl: item.dl, embed: item.embed,
          thumb: item.thumb, platform: item.platform, cat: item.cat, desc: item.desc
        });
        // Use img tag to send GET request (no CORS issues)
        return new Promise(resolve => {
          const img = new Image();
          img.onload = img.onerror = () => resolve(true);
          img.src = SCRIPT_URL + '?' + params.toString();
          setTimeout(() => resolve(true), 2000); // fallback
        });
      }

      // ========== INIT LOAD ==========
      async function init() {
        loadLocal();
        const sheetItems = await fetchSheet();
        if (sheetItems.length) {
          // Merge: sheet items override by ID
          const map = new Map(items.map(i => [i.id, i]));
          sheetItems.forEach(s => map.set(s.id, s));
          items = [...map.values()];
          saveLocal();
        }
        render();
      }

      // ========== RENDER ==========
      function counts() {
        document.querySelectorAll('.tab .count').forEach(el => {
          const t = el.parentElement.dataset.tab;
          el.textContent = items.filter(i => i.section === t).length;
        });
      }

      function render() {
        const filtered = items.filter(i => i.section === tab);
        counts();
        if (!filtered.length) {
          gallery.innerHTML = `<div class="empty-state"><i class="fas fa-folder-open"></i><p>No items. Click Add Media!</p></div>`;
          return;
        }
        gallery.innerHTML = filtered.map(i => {
          let m = '';
          const src = i.thumb || i.url || '';
          if (i.section === 'photos') {
            m = `<img src="${src}" alt="${i.name}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=design-preview><i class=fAS fa-image></i></div>';">`;
          } else if (i.section === 'videos') {
            m = i.embed ? `<iframe src="${i.embed}" allowfullscreen></iframe>` :
              `<video src="${src}" controls style="width:100%;height:100%;object-fit:cover;"></video>`;
          } else if (i.section === 'designs') {
            m = `<div class="design-preview"><i class="fas fa-palette"></i><a href="${i.url}" target="_blank">Open Design</a></div>`;
          } else {
            m = `<div class="design-preview"><i class="fas fa-file"></i><a href="${i.dl||i.url}" target="_blank">View File</a></div>`;
          }
          return `<div class="card">
            <div class="media-frame">${m}</div>
            <div class="card-body">
              <div class="card-info">
                <div class="item-name">${i.name}</div>
                <div class="item-meta"><span class="platform-badge">${i.platform||'Link'}</span>${i.cat?`<span class="category-tag">📁 ${i.cat}</span>`:''}</div>
              </div>
              <div class="card-actions">
                <button class="icon-btn" data-copy="${i.dl||i.url}"><i class="fas fa-copy"></i></button>
                <button class="icon-btn dl-btn" data-dl="${i.dl||i.url}" data-name="${i.name}"><i class="fas fa-download"></i></button>
                <button class="icon-btn" data-del="${i.id}" style="color:#ef4444;"><i class="fas fa-trash"></i></button>
              </div>
            </div>
          </div>`;
        }).join('');
        // Events
        gallery.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => {
          navigator.clipboard.writeText(b.dataset.copy); toast('📋 Copied!');
        });
        gallery.querySelectorAll('[data-dl]').forEach(b => b.onclick = () => {
          const a = document.createElement('a'); a.href = b.dataset.dl; a.download = b.dataset.name||'file'; a.click();
        });
        gallery.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
          if (confirm('Delete?')) {
            items = items.filter(i => i.id !== b.dataset.del);
            saveLocal(); render(); toast('🗑️ Deleted');
          }
        });
      }

      // ========== TABS ==========
      document.getElementById('tabsContainer').addEventListener('click', e => {
        const t = e.target.closest('.tab');
        if (!t) return;
        document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        tab = t.dataset.tab;
        render();
      });

      // ========== MODAL ==========
      function resetPreview() {
        uploadBox.classList.remove('filled');
        prevImg.style.display = prevVid.style.display = prevIframe.style.display = 'none';
        $('fileNameDisplay').textContent = '';
        fileData = null; fileType = null;
        $('fileInput').value = '';
      }

      function showPreview(type, src) {
        uploadBox.classList.add('filled');
        prevImg.style.display = prevVid.style.display = prevIframe.style.display = 'none';
        if (type === 'image') { prevImg.src = src; prevImg.style.display = 'block'; }
        else if (type === 'video') { prevVid.src = src; prevVid.style.display = 'block'; }
        else if (type === 'iframe') { prevIframe.src = src; prevIframe.style.display = 'block'; }
      }

      function handleFile(f) {
        const reader = new FileReader();
        reader.onload = e => {
          fileData = e.target.result;
          fileType = f.type.startsWith('image/') ? 'image' : f.type.startsWith('video/') ? 'video' : 'other';
          showPreview(fileType, fileData);
          $('fileNameDisplay').textContent = '📁 ' + f.name;
          $('nameInput').value = f.name.replace(/\.[^.]+$/, '');
          $('sectionSelect').value = fileType === 'image' ? 'photos' : fileType === 'video' ? 'videos' : 'other';
          $('linkInput').value = '';
        };
        reader.readAsDataURL(f);
      }

      function handleLink(url) {
        if (!url) return;
        const drive = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
        const yt = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|embed\/)([a-zA-Z0-9_-]+)/);
        if (drive) {
          const id = drive[1];
          showPreview('image', `https://drive.google.com/thumbnail?id=${id}&sz=w600`);
          $('sectionSelect').value = 'photos';
          $('fileNameDisplay').textContent = '🔗 Google Drive';
        } else if (yt) {
          showPreview('iframe', `https://www.youtube.com/embed/${yt[1]}`);
          $('sectionSelect').value = 'videos';
          $('fileNameDisplay').textContent = '🔗 YouTube';
        } else if (url.match(/\.(jpg|jpeg|png|gif|webp)/i)) {
          showPreview('image', url); $('sectionSelect').value = 'photos';
        } else if (url.match(/\.(mp4|webm|mov)/i)) {
          showPreview('video', url); $('sectionSelect').value = 'videos';
        } else {
          uploadBox.classList.add('filled');
          $('sectionSelect').value = 'other';
          $('fileNameDisplay').textContent = '🔗 Link';
        }
      }

      // Modal events
      $('addBtn').onclick = () => { modal.classList.add('show'); $('sectionSelect').value = tab; resetPreview(); $('linkInput').value = ''; $('nameInput').value = ''; $('catInput').value = ''; };
      $('cancelBtn').onclick = () => { modal.classList.remove('show'); resetPreview(); };
      modal.onclick = e => { if (e.target === modal) { modal.classList.remove('show'); resetPreview(); } };
      $('changeBtn').onclick = e => { e.stopPropagation(); resetPreview(); };

      uploadBox.onclick = () => $('fileInput').click();
      uploadBox.ondragover = e => { e.preventDefault(); };
      uploadBox.ondrop = e => { e.preventDefault(); if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); };
      $('fileInput').onchange = e => { if (e.target.files[0]) handleFile(e.target.files[0]); };
      $('linkInput').oninput = function() {
        const v = this.value.trim();
        if (v) { resetPreview(); handleLink(v); }
      };

      // ========== SAVE (INSTANT) ==========
      $('saveBtn').onclick = () => {
        const name = $('nameInput').value.trim();
        if (!name) { toast('Enter name', false); return; }

        const section = $('sectionSelect').value;
        const cat = $('catInput').value.trim();
        const rawLink = $('linkInput').value.trim();
        const id = 'i' + Date.now() + Math.random().toString(36).slice(2,6);

        let url, dl, embed, thumb, platform;

        if (fileData) {
          url = dl = thumb = fileData; embed = ''; platform = 'Device Upload';
        } else if (rawLink) {
          const drive = rawLink.match(/\/d\/([a-zA-Z0-9_-]+)/);
          const yt = rawLink.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|embed\/)([a-zA-Z0-9_-]+)/);
          if (drive) {
            const id = drive[1];
            url = `https://drive.google.com/uc?export=view&id=${id}`;
            dl = `https://drive.google.com/uc?export=download&id=${id}`;
            embed = `https://drive.google.com/file/d/${id}/preview`;
            thumb = `https://drive.google.com/thumbnail?id=${id}&sz=w600`;
            platform = 'Google Drive';
          } else if (yt) {
            url = dl = rawLink; embed = `https://www.youtube.com/embed/${yt[1]}`; thumb = ''; platform = 'YouTube';
          } else {
            url = dl = thumb = rawLink; embed = ''; platform = 'Direct Link';
          }
        } else {
          toast('Upload or paste link', false); return;
        }

        const item = { id, section, name, url, dl, embed, thumb, platform, cat, desc: '' };

        // INSTANT save
        items.push(item);
        saveLocal();
        modal.classList.remove('show');
        resetPreview();
        tab = section;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelector(`[data-tab="${section}"]`).classList.add('active');
        render();
        toast('✅ Saved!');

        // Background sync (non-blocking)
        saveToSheet(item);
      };

      // Refresh
      $('refreshBtn').onclick = async () => { await init(); toast('🔄 Synced!'); };

      // Start
      init();
    })();
  </script>
</body>
</html>
